version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0
dependencies:
  args: ^2.7.0
  crypto: ^3.0.8
  http: ^1.6.0
  path: ^1.9.1
  search_folding:
    path: ../../packages/search_folding
  sqlite3: ^3.9.1
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
